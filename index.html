<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Demo - Dynamic Content Loader</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation Header -->
        <header class="header">
            <nav class="navbar" role="navigation" aria-label="Main navigation">
                <div class="nav-brand">
                    <a href="/" data-link>SPA Demo</a>
                </div>
                <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">
                    <span class="hamburger"></span>
                </button>
                <ul class="nav-menu" id="nav-menu" role="menubar">
                    <li role="none"><a href="/" data-link role="menuitem">Home</a></li>
                    <li role="none"><a href="/about" data-link role="menuitem">About</a></li>
                    <li role="none"><a href="/services" data-link role="menuitem">Services</a></li>
                    <li role="none"><a href="/portfolio" data-link role="menuitem">Portfolio</a></li>
                    <li role="none"><a href="/contact" data-link role="menuitem">Contact</a></li>
                </ul>
            </nav>
        </header>

        <!-- Loading Indicator -->
        <div class="loading-overlay" id="loading-overlay" role="status" aria-live="polite" aria-hidden="true">
            <div class="spinner"></div>
            <span class="loading-text">Loading...</span>
        </div>

        <!-- Main Content Area -->
        <main class="main-content" id="main-content" role="main">
            <!-- Content will be dynamically loaded here -->
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2024 SPA Demo. Built with vanilla HTML, CSS & JavaScript.</p>
            </div>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
